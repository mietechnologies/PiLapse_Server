services:
  mongodb:
    image: mongo:7
    container_name: PiLapseMongoDB
    restart: unless-stopped
    # Not published on the host; only the app container talks to it.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-pilapse}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?set in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set in .env}
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  node_app:
    build: .
    container_name: PiLapseServer
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - ${PILAPSE_PORT:-3000}:3000
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_DATABASE:-pilapse}
      PHOTOS_DIRECTORY: /app/uploads
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      TRUST_PROXY: ${TRUST_PROXY:-}
    volumes:
      - app_data:/app/uploads

volumes:
  mongodb_data:
  app_data:
